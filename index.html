<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>
    <header class="header">
        <h1>Student Expense Tracker</h1>
        <p>Write down what you spend, see where it goes.</p>
    </header>

    <main class="layout">
        <!-- add expense form -->
        <section class="box">
            <h2>Add an expense</h2>

            <label for="name">What did you buy?</label>
            <input type="text" id="name" placeholder="e.g. Samosa, notebook, bus pass">

            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" placeholder="0">

            <label for="category">Category</label>
            <select id="category">
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
            </select>

            <button class="btn" id="addBtn">Add Expense</button>
            <p id="error"></p>
        </section>

        <!-- expense list -->
        <section class="box list-box">
            <div class="total-area">
                <span class="total-label">Total spent</span>
                <span class="total-number">₹<span id="total">0</span></span>
            </div>

            <div class="top-row">
                <h2>Your expenses</h2>
                <select id="filter" aria-label="Filter by category">
                    <option value="All">All categories</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <ul id="list"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
